<!doctype html>
<html lang="en">

      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Michael Dean L. Belen | IT Officer & Web Developer
    </title>

    <!-- =====================================================
         INITIAL THEME
         Apply the saved theme BEFORE React renders.
         This prevents the light-theme flash when dark mode
         is stored in localStorage.
    ====================================================== -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");

          if (saved !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // Storage unavailable; default to dark theme.
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
